<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #16213e;
    }
    
    h1 {
      font-size: 20px;
      color: #00d9ff;
      margin-bottom: 4px;
    }
    
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .status.active {
      background: #00ff8833;
      color: #00ff88;
    }
    
    .status.inactive {
      background: #ff444433;
      color: #ff4444;
    }
    
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    .input-group:last-child {
      margin-bottom: 0;
    }
    
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #aaa;
      font-weight: 500;
    }
    
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #2d3561;
      border-radius: 6px;
      background: #0f1624;
      color: #eee;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus {
      border-color: #00d9ff;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #1a1a2e;
    }
    
    .btn-success:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.4);
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
      color: white;
    }
    
    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .trades-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .logs-container {
      max-height: 250px;
      overflow-y: auto;
      background: #0f1624;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.6;
    }
    
    .log-entry {
      margin-bottom: 6px;
      padding: 4px 0;
      border-bottom: 1px solid #1a1a2e;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #666;
      margin-right: 8px;
    }
    
    .log-info {
      color: #00d9ff;
    }
    
    .log-success {
      color: #00ff88;
    }
    
    .log-error {
      color: #ff4444;
    }
    
    .log-warning {
      color: #ffaa00;
    }
    
    .trade-item {
      background: #0f1624;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      border-left: 3px solid #00d9ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .trade-item.win {
      border-left-color: #00ff88;
    }
    
    .trade-item.loss {
      border-left-color: #ff4444;
    }
    
    .trade-content {
      flex: 1;
    }
    
    .btn-cancel {
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .btn-cancel:hover {
      background: #cc0000;
      transform: scale(1.05);
    }
    
    .trade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .trade-pair {
      font-weight: 600;
      font-size: 13px;
    }
    
    .trade-direction {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .trade-direction.call {
      background: #00ff8833;
      color: #00ff88;
    }
    
    .trade-direction.put {
      background: #ff444433;
      color: #ff4444;
    }
    
    .trade-info {
      font-size: 11px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #666;
      font-size: 13px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .stat-card {
      background: #0f1624;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #00d9ff;
      margin-bottom: 4px;
    }
    
    .stat-label {
      font-size: 11px;
      color: #888;
    }
    
    .martingale-info {
      background: #0f1624;
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
    }
    
    .martingale-level {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
    }
    
    .martingale-level:not(:last-child) {
      border-bottom: 1px solid #2d3561;
    }
    
    .level-number {
      color: #00d9ff;
      font-weight: 600;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #0f1624;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #2d3561;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #3d4571;
    }
    
    .webhook-url {
      background: #0f1624;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      word-break: break-all;
      color: #00d9ff;
      margin-top: 8px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 PocketOption Bot</h1>
    <span class="status inactive" id="botStatus">Не активний</span>
  </div>

  <div class="section">
    <div class="section-title">⚙️ Налаштування</div>
    
    <div class="input-group">
      <label>Тип ставки</label>
      <select id="stakeType">
        <option value="fixed">Фіксована сума (₴)</option>
        <option value="percent">Відсоток від депозиту (%)</option>
      </select>
    </div>
    
    <div class="input-group" id="fixedAmountGroup">
      <label>Фіксована сума (₴)</label>
      <input type="number" id="initialAmount" value="100" min="50" step="10">
    </div>
    
    <div class="input-group" id="percentAmountGroup" style="display: none;">
      <label>Відсоток від депозиту (%)</label>
      <input type="number" id="percentAmount" value="1" min="0.01" max="100" step="0.1">
    </div>
    
    <div class="input-group">
      <label>Таймфрейм за замовчуванням</label>
      <select id="defaultTimeframe">
        <option value="1">1 хвилина</option>
        <option value="5" selected>5 хвилин</option>
        <option value="15">15 хвилин</option>
        <option value="30">30 хвилин</option>
        <option value="60">1 година</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🔄 Мартингейл</div>
    
    <div class="input-group">
      <label>Максимальний рівень мартингейлу</label>
      <select id="maxMartingale">
        <option value="0">Без мартингейлу</option>
        <option value="1">1 рівень</option>
        <option value="2">2 рівні</option>
        <option value="3" selected>3 рівні</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>Множник для фіксованої суми</label>
      <input type="number" id="martingaleMultiplier" value="2.3" min="1.1" step="0.1">
    </div>
    
    <div class="input-group">
      <label>Множник для відсотка</label>
      <input type="number" id="martingaleMultiplierPercent" value="2.0" min="1.1" step="0.1">
    </div>
    
    <div class="input-group">
      <label style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="globalMartingale" checked>
        <span>Глобальний мартингейл (чекати новий сігнал після всіх програшів)</span>
      </label>
    </div>
    
    <div class="martingale-levels" id="martingaleLevels" style="margin-top: 12px;">
      <div style="font-size: 12px; color: #00d9ff; margin-bottom: 8px;">Активні рівні:</div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px;">
        <input type="checkbox" id="level1" checked>
        <span>Рівень 1</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px;">
        <input type="checkbox" id="level2" checked>
        <span>Рівень 2</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px;">
        <input type="checkbox" id="level3" checked>
        <span>Рівень 3</span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎯 Керування</div>
    <button class="btn btn-success" id="startBot">▶️ Запустити бота</button>
    <button class="btn btn-danger" id="stopBot" style="display: none;">⏹️ Зупинити бота</button>
    <button class="btn btn-primary" id="testSignal">🧪 Тестовий сигнал</button>
  </div>

  <div class="section">
    <div class="section-title">📊 Статистика</div>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalTrades">0</div>
        <div class="stat-label">Угод</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="winRate">0%</div>
        <div class="stat-label">Винрейт</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalProfit">0 ₴</div>
        <div class="stat-label">Прибуток</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="scheduledCount">0</div>
        <div class="stat-label">Заплановано</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 Активні угоди</div>
    <div class="trades-list" id="tradesList">
      <div class="empty-state">
        Немає активних угод
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📝 Логи</div>
    <div class="logs-container" id="logsContainer">
      <div class="empty-state">
        Логи з'являться тут...
      </div>
    </div>
    <button class="btn btn-primary" id="clearLogs" style="margin-top: 8px;">🗑️ Очистити логи</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
